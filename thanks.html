<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>אישור תשלום | לירון משלוחים</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#080a0d;--panel:#12161c;--gold:#ffd12c;--muted:#b6bac2}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:#fff;font-family:Heebo,Arial,sans-serif;padding:20px}
.box{width:min(520px,100%);background:var(--panel);border:1px solid #b18a2e66;border-radius:24px;padding:36px 28px;text-align:center}
.ic{width:72px;height:72px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:#ffffff12}
.ok .ic{background:#1f5a3a;color:#7fd49c}.bad .ic{background:#5a1f1f;color:#ff9a9a}
h1{margin:0 0 10px;font-size:1.9rem;font-weight:900}p{color:var(--muted);line-height:1.8;margin:0 0 8px}
dl{margin:18px 0;display:grid;gap:8px;text-align:right}dl div{display:flex;justify-content:space-between;border-bottom:1px solid #ffffff14;padding-bottom:8px}dt{color:var(--muted)}dd{margin:0;font-weight:700}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:22px}
a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:12px;font-weight:800;text-decoration:none}
.p{background:var(--gold);color:#0a0a0a}.o{border:1px solid #ffffff50;color:#fff}
</style></head><body>
<main class="box" id="box"><div class="ic" aria-hidden="true"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9" opacity=".3"></circle></svg></div><h1 id="t">בודקים את התשלום…</h1><p id="m">רק רגע.</p><dl id="d" hidden></dl><div class="btns" id="b" hidden></div></main>
<script>
if(window.top!==window.self){try{window.top.location.href=location.href}catch(e){}}
(function(){
var q=new URLSearchParams(location.search),id=q.get('lowprofilecode')||q.get('LowProfileId')||q.get('lowProfileId');
var WA='972525068475',box=document.getElementById('box');
function done(ok,info){
  box.className='box '+(ok?'ok':'bad');
  box.querySelector('.ic').innerHTML=ok?'<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>':'<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"></path></svg>';
  document.getElementById('t').textContent=ok?'התשלום התקבל!':'לא ניתן לאשר את התשלום';
  document.getElementById('m').textContent=ok?'תודה! שלחו לנו את פרטי ההזמנה בוואטסאפ (אם עוד לא שלחתם), ונתאם איתכם איסוף.':'לא הצלחנו לאמת את התשלום. לפני תשלום נוסף, בדקו את מצב החיוב או פנו אלינו בוואטסאפ.';
  var d=document.getElementById('d');
  if(ok&&info){[['סכום',info.amount!=null?info.amount+'₪':''],['מספר הזמנה',info.ref||''],['אסמכתא',info.deal||''],['כרטיס',info.last4?'**** '+info.last4:'']].forEach(function(r){if(!r[1])return;var x=document.createElement('div'),a=document.createElement('dt'),b=document.createElement('dd');a.textContent=r[0];b.textContent=r[1];x.appendChild(a);x.appendChild(b);d.appendChild(x);});d.hidden=false;}
  var saved='';try{saved=sessionStorage.getItem('ordMsg')||''}catch(e){}
  var msg=ok&&saved?saved+'\n✅ התשלום התקבל'+(info&&info.deal?' · אסמכתא '+info.deal:''):ok?'שלום לירון, שילמתי באשראי '+(info&&info.amount?info.amount+'₪':'')+' על משלוח. מספר הזמנה: '+((info&&info.ref)||''):'שלום לירון, ניסיתי לשלם באשראי וברצוני לבדוק את מצב התשלום.';
  var b=document.getElementById('b');b.innerHTML='';
  var w=document.createElement('a');w.className='btn p';w.href='https://wa.me/'+WA+'?text='+encodeURIComponent(msg);w.target='_blank';w.rel='noopener';w.textContent=ok?'שליחת פרטי ההזמנה בוואטסאפ':'דברו איתנו בוואטסאפ';
  var h=document.createElement('a');h.className='btn o';h.href=ok?'index.html':'index.html#order';h.textContent=ok?'חזרה לאתר':'חזרה להזמנה';
  b.appendChild(w);b.appendChild(h);b.hidden=false;
}
if(!id){done(false);return;}
fetch('/.netlify/functions/verify?id='+encodeURIComponent(id)).then(function(r){return r.json()}).then(function(j){done(!!j.ok,j)}).catch(function(){done(false)});
})();
</script></body></html>
